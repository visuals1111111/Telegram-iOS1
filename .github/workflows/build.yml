name: CI

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: 'Custom build number (leave blank for automatic)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    name: Build Swiftgram IPA
    runs-on: macos-14
    timeout-minutes: 360

    steps:
      - name: Free Disk Space
        run: |
          echo "=== Disk space before cleanup ==="
          df -h
          sudo rm -rf /Users/runner/Library/Android || true
          sudo rm -rf "$ANDROID_HOME" || true
          sudo rm -rf "$ANDROID_NDK_HOME" || true
          echo "=== Disk space after cleanup ==="
          df -h

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: '0'

      - name: Set active Xcode path
        run: |
          set -x
          XCODE_VERSION=$(cat versions.json | python3 -c 'import json,sys;obj=json.load(sys.stdin);print(obj.get("xcode", ""))')
          if [ -d "/Applications/Xcode_$XCODE_VERSION.app" ]; then
            sudo xcode-select -s /Applications/Xcode_$XCODE_VERSION.app/Contents/Developer
          elif [ -d "/Applications/Xcode.app" ]; then
            sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          fi
          echo "Active Xcode path: $(xcode-select -p)"
          xcodebuild -version

      - name: Create canonical source directory
        run: |
          set -x
          sudo mkdir -p /Users/Shared
          cp -R "$GITHUB_WORKSPACE" /Users/Shared/
          mv /Users/Shared/$(basename "$GITHUB_WORKSPACE") /Users/Shared/telegram-ios

      - name: Build the App
        run: |
          set -x

          # source code paths are included in the final binary, so we need to make them stable across builds
          SOURCE_DIR=/Users/Shared/telegram-ios

          # use canonical bazel root
          BAZEL_USER_ROOT="/private/var/tmp/_bazel_containerhost"

          cd "$SOURCE_DIR"

          BUILD_NUMBER_OFFSET="$(cat build_number_offset)"
          export APP_VERSION=$(cat versions.json | python3 -c 'import json,sys;obj=json.load(sys.stdin);print(obj.get("app", "13.1.3"))')

          if [ -n "${{ github.event.inputs.build_number }}" ]; then
            export BUILD_NUMBER="${{ github.event.inputs.build_number }}"
          else
            export COMMIT_COUNT=$(git rev-list --count HEAD)
            export COMMIT_COUNT="$(($COMMIT_COUNT+$BUILD_NUMBER_OFFSET))"
            export BUILD_NUMBER="$COMMIT_COUNT"
          fi

          echo "BUILD_NUMBER=$BUILD_NUMBER" >> $GITHUB_ENV
          echo "APP_VERSION=$APP_VERSION" >> $GITHUB_ENV

          python3 build-system/Make/ImportCertificates.py --path build-system/fake-codesigning/certs
          python3 -u build-system/Make/Make.py \
            --bazelUserRoot="$BAZEL_USER_ROOT" \
            --overrideXcodeVersion \
            --overrideBazelVersion \
            build \
            --configurationPath="build-system/appstore-configuration.json" \
            --codesigningInformationPath=build-system/fake-codesigning \
            --outputBuildArtifactsPath="build/artifacts" \
            --configuration=release_arm64 \
            --buildNumber="$BUILD_NUMBER"

          echo "=== Build artifacts ==="
          ls -lh build/artifacts/

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Swiftgram-iOS-IPA
          path: /Users/Shared/telegram-ios/build/artifacts/*.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload DSYM Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Swiftgram-iOS-DSYM
          path: /Users/Shared/telegram-ios/build/artifacts/*.zip
          if-no-files-found: ignore
          retention-days: 7

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: success()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: build-${{ env.BUILD_NUMBER }}
          name: Swiftgram ${{ env.APP_VERSION }} (${{ env.BUILD_NUMBER }})
          body: |
            An unsigned build of Swiftgram for iOS ${{ env.APP_VERSION }} (${{ env.BUILD_NUMBER }})
            Compatible with TrollStore, AltStore, Scarlet, Sideloadly.
          draft: false
          prerelease: false
          files: |
            /Users/Shared/telegram-ios/build/artifacts/*.ipa
            /Users/Shared/telegram-ios/build/artifacts/*.zip
